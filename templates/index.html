    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .content-area {
            padding: 40px;
        }

        .upload-section {
            background: linear-gradient(145deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.2);
        }

        .image-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .image-display {
            width: 100%;
            height: 300px;
            background: linear-gradient(145deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .image-display img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
            object-fit: cover;
            width: 100%;
            height: 100%;
        }

        .image-display video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .upload-placeholder {
            text-align: center;
            color: #6c757d;
        }

        .upload-placeholder i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #667eea;
        }

        .btn-group-custom {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-custom {
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn-custom::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-custom:hover::before {
            left: 100%;
        }

        .btn-upload {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-predict {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }

        .results-section {
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            border-radius: 15px;
            padding: 30px;
            border: 2px solid #e9ecef;
        }

        .results-header {
            text-align: center;
            margin-bottom: 25px;
            color: #495057;
        }

        .results-header h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .results-content {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .result-box {
            flex: 1;
            min-width: 250px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9ecef;
        }

        .result-box h4 {
            color: #495057;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .json-result {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
        }

        .prediction-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .prediction-ripe {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #856404;
        }

        .prediction-rotten {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
        }

        .prediction-unripe {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }

        .prediction-unknown {
            background: linear-gradient(135deg, #6c757d, #495057);
            color: white;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(5px);
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .content-area {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .btn-group-custom {
                flex-direction: column;
                align-items: center;
            }
            
            .results-content {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1><i class="fas fa-brain"></i> Banana Classification AI</h1>
            <p>Upload an image to classify bananas as Ripe, Unripe, or Rotten</p>
        </div>

        <div class="content-area">
            <div class="upload-section">
                <div class="image-container">
                    <div class="image-display">
                        <div class="upload-placeholder">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click Upload to select an image</p>
                        </div>
                        <video autoplay id="video" class="hidden"></video>
                        <img src="" id="photo" class="hidden">
                        <canvas style="display:none;" id="canvas"></canvas>
                    </div>
                </div>

                <div class="btn-group-custom">
                    <button type="button" class="btn-custom btn-upload" id="uload">
                        <i class="fas fa-upload"></i> Upload Image
                    </button>
                    <button id="send" type="button" class="btn-custom btn-predict">
                        <i class="fas fa-magic"></i> Predict
                    </button>
                </div>

                <input type="hidden" class="form-control mr-2" id="url" value="../predict"/>
                <input name="upload" type="file" id="fileinput" style="position:absolute;top:-500px;"/>
            </div>

            <div class="results-section">
                <div class="results-header">
                    <h3><i class="fas fa-chart-bar"></i> Prediction Results</h3>
                    <p>Analysis results will appear here</p>
                </div>
                <div class="results-content">
                    <div class="result-box">
                        <h4><i class="fas fa-image"></i> Processed Image</h4>
                        <div class="res-part2"></div>
                    </div>
                    <div class="result-box">
                        <h4><i class="fas fa-code"></i> JSON Response</h4>
                        <div class="res-part">
                            <div class="jsonRes"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loading" class="hidden">
        <div class="loader"></div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <script>
    var mybtn = document.getElementById('startbtn');
    var myvideo = document.getElementById('video');
    var mycanvas = document.getElementById('canvas');
    var myphoto = document.getElementById('photo');
    var base_data = "";

    function sendRequest(base64Data){
        var type = "json";
        if(base64Data != "" || base64Data != null){
            if(type == "imgtobase"){
                $(".res-part").html("");
                $(".res-part").html(base64Data);
            }
            else if(type == "basetoimg"){
                var imageData = $("#imgstring").val();
                $(".res-part").html("");
                $(".res-part").append("<img src='data:image/jpeg;base64," + imageData + "' alt='' />");
            }
            else{
                var url = $("#url").val();
                $("#loading").removeClass('hidden');
                $.ajax({
                    url : url,
                    type: "post",
                    cache: false,
                    async: true,
                    crossDomain: true,
                    headers: {
                        'Content-Type': 'application/json',
                        'Access-Control-Allow-Origin':'*'
                    },
                    data:JSON.stringify({image:base64Data}),
                    success: function(res){
                        $(".res-part").html("");
                        $(".res-part2").html("");
                        try{
                            var imageData = res[1].image;
                            if(imageData.length > 100){
                                if(imageData.length > 10){
                                    $(".res-part2").append("<img class='resp-img' src='data:image/jpeg;base64," + imageData + "' alt='' style='max-width: 100%; border-radius: 8px;' />");
                                }
                            }
                        }catch(e){}
                        
                        // Format the JSON response with better styling
                        var jsonResponse = JSON.stringify(res[0], undefined, 2);
                        $(".res-part").html("<div class='json-result'>" + jsonResponse + "</div>");
                        
                        // Add prediction badge
                        var prediction = res[0].image;
                        var badgeClass = '';
                        if(prediction === 'ripe_1') badgeClass = 'prediction-ripe';
                        else if(prediction === 'rotten_1') badgeClass = 'prediction-rotten';
                        else if(prediction === 'unripe_1') badgeClass = 'prediction-unripe';
                        else if(prediction === 'unknown') badgeClass = 'prediction-unknown';
                        
                        if(badgeClass) {
                            $(".res-part").prepend("<div class='prediction-badge " + badgeClass + "' style='margin-bottom: 15px;'>" + prediction + "</div>");
                        }
                        
                        $("#loading").addClass('hidden');
                    },
                    error: function() {
                        $("#loading").addClass('hidden');
                        $(".res-part").html("<div style='color: #dc3545; padding: 15px; background: #f8d7da; border-radius: 8px;'>Error: Could not process the image. Please try again.</div>");
                    }
                });
            }
        }
    }

    $(document).ready(function(){
        $("#loading").addClass('hidden');

        $('#send').click(function(evt){
            if(base_data === "") {
                alert("Please upload an image first!");
                return;
            }
            sendRequest(base_data);
        });

        $('#uload').click(function(evt) {
            $('#fileinput').focus().trigger('click');
        });
        
        $("#fileinput").change(function(){
            if (this.files && this.files[0]){
                var reader = new FileReader();
                reader.onload = function (e){
                    var url = e.target.result;
                    var img = new Image();
                    img.crossOrigin = 'Anonymous';
                    img.onload = function(){
                        var canvas = document.createElement('CANVAS');
                        var ctx = canvas.getContext('2d');
                        canvas.height = this.height;
                        canvas.width = this.width;
                        ctx.drawImage(this, 0, 0);
                        base_data = canvas.toDataURL('image/jpeg', 1.0).replace(/^data:image.+;base64,/, '');
                        canvas = null;
                    };
                    img.src = url;
                    
                    // Show the uploaded image
                    $('#photo').attr('src', url);
                    $('#photo').removeClass('hidden').show();
                    $('#video').addClass('hidden');
                    $('.upload-placeholder').addClass('hidden');
                }
                reader.readAsDataURL(this.files[0]);
            }
        });
    });
    </script>
</body>
</html>
